name: Сборка Pawn — оригинальный прототип

on:
  push:
    paths:
      - 'Мод/prototypes/**'
      - 'Мод/tools/**'
      - '.github/workflows/pawn-starter.yml'
  pull_request:
    paths:
      - 'Мод/prototypes/**'
      - 'Мод/tools/**'
      - '.github/workflows/pawn-starter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pawn-starter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Скомпилировать оригинальный прототип Pawn
        run: bash Мод/tools/build-prototype.sh
      - name: Установить 32-битные библиотеки для open.mp
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libc6:i386 libstdc++6:i386 libatomic1:i386
      - name: Проверить запуск open.mp и UDP-ответ
        run: bash Мод/tools/run-openmp-smoke.sh
      - name: Сохранить тестовый AMX
        uses: actions/upload-artifact@v4
        with:
          name: vostera-starter-amx
          path: Мод/build/vostera_starter.amx
          if-no-files-found: error
          retention-days: 14
