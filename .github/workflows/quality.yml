name: Проверка VOSTERA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Установить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Проверить синтаксис всех PHP-файлов
        shell: bash
        run: |
          set -euo pipefail
          find 'Сайт' 'Форум' 'Вики' -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Проверить приватные файлы и структуру
        run: python3 tools/check_repository.py
      - name: Проверить правила публичного репозитория
        run: python3 tools/test_repository_policy.py
      - name: Проверить безопасную установку
        run: python3 tools/test_install_bootstrap.py
      - name: Проверить диагностику игрового мода
        run: python3 tools/test_mod_preflight.py
      - name: Проверить оригинальный Pawn-прототип
        run: python3 tools/test_pawn_starter.py
      - name: Проверить UDP-парсер тестового сервера
        run: python3 Мод/tools/smoke-prototype.py --self-test
      - name: Проверить SA-MP мониторинг по протоколу open.mp
        run: php Сайт/tests/test_samp_query.php
      - name: Проверить права публикаций форума
        run: php Форум/tests/test_post_permissions.php
      - name: Проверить безопасное сохранение Wiki
        run: php Вики/tests/test_storage.php
      - name: Проверить страницы, установку и доступ через HTTP
        run: python3 tools/test_web_smoke.py
